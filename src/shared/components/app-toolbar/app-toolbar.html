<mat-toolbar>
  <div class="toolbar-title">
    @if (titleLink(); as link) {
      <a class="plain" [routerLink]="link">{{ toolbarTitle() }}</a>
    } @else {
      <span>{{ toolbarTitle() }}</span>
    }
  </div>

  <div class="toolbar-status">
    @if (loading()) {
      <mat-spinner [diameter]="24" aria-label="Loading"/>
    }

    @if (error(); as errorMessage) {
      <app-error-message
        class="toolbar-error"
        [message]="errorMessage"
        [contrast]="true"
        [truncate]="true"/>
    }
  </div>

  <div class="toolbar-actions">
    <ng-content/>
  </div>
</mat-toolbar>
