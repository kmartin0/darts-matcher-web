<div class="header-container">
  <h1 class="header">Darts Matcher</h1>
  <h2 class="subheader">Create, play and share your darts matches.</h2>
</div>

<div class="content-container">
  <mat-card class="section-container" appearance="raised">
    <div class="section-header">
      <mat-icon aria-hidden="true">target</mat-icon>
      <h3>Create match</h3>
      <app-theme-toggle/>
    </div>

    <mat-card-content>
      <app-create-match-form [submitAction]="onCreateMatchSubmit"/>
    </mat-card-content>
  </mat-card>

  <mat-card class="section-container" appearance="raised">
    <div class="section-header">
      <mat-icon aria-hidden="true">login</mat-icon>
      <h3>Go to match page</h3>
    </div>

    <mat-card-content>
      <app-match-id-form [submitAction]="onMatchIdSubmit"/>
    </mat-card-content>
  </mat-card>

  <mat-card class="section-container" appearance="raised">
    <div class="section-header">
      <mat-icon aria-hidden="true">list_alt</mat-icon>
      <h3>Match history</h3>
    </div>

    <mat-card-content>
      <a
        matButton="outlined"
        class="match-history-button"
        [routerLink]="AppEndpoints.matchHistory()">
        <mat-icon></mat-icon>
        Open match history
        <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </a>
    </mat-card-content>
  </mat-card>
</div>
